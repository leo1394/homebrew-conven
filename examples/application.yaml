version: 3

workspace:
  name: local-services
  disabledBindings: []

environments:
  dev:
    registries:
      nacos:
        driver: nacos
        address: http://nacos-headless.default:8848
        namespace: dev
        usernameEnv: NACOS_USERNAME
        passwordEnv: NACOS_PASSWORD
        observeFor: 5s
    env:
      PROFILE_ACTIVE: dev
      NACOS_ADDR: nacos-headless.default:8848
    connection:
      driver: ktctl
      kubeconfigEnv: CONVEN_KUBECONFIG
      context: dev-cluster
      namespace: dev
      args: [--podCreationTimeout, "120", --portForwardTimeout, "30"]
      timeout: 240s
      readiness:
        - name: nacos
          address: nacos-headless.default:8848
    resolutions:
      user-svc:
        order-svc:
          mode: remote
        payment-svc:
          mode: remote
      order-svc:
        payment-svc:
          mode: remote

policies:
  go-service:
    drivers:
      runtime: go-generic
      framework: go
      configSource: environment
      discovery: passive
      materializer: environment
    routing:
      servers:
        http:
          port: http
          env:
            PORT: "${port.http}"
          isolation:
            registration:
              mode: not-applicable
            listener:
              path: HOST
              value: 127.0.0.1
        rpc:
          port: rpc
          env:
            PORT: "${port.rpc}"
          isolation:
            registration:
              mode: not-applicable
            listener:
              path: HOST
              value: 127.0.0.1

services:
  user-svc:
    path: services/user-svc
    policy: go-service
    kinds: [http]
    discovery:
      analyzer: go-module
      certifier: go-generic
    runner:
      workdir: .
      prepare: [go, mod, download]
      build: [go, build, -o, "${artifact}", ./cmd/server]
      run: ["${artifact}"]
    ports:
      http: 18080
    healthChecks:
      - server: http
        type: http
        url: "http://127.0.0.1:${port.http}/health"
        timeout: 30s
    dependencies:
      order-svc:
        localEnv:
          ORDER_SVC_ADDR: "127.0.0.1:${services.order-svc.ports.http}"
          ORDER_SVC_DISCOVERY_ENABLED: "false"
        remoteEnv:
          ORDER_SVC_NAME: order-svc
          ORDER_SVC_DISCOVERY_ENABLED: "true"
      payment-svc:
        localEnv:
          PAYMENT_SVC_ADDR: "127.0.0.1:${services.payment-svc.ports.rpc}"
          PAYMENT_SVC_DISCOVERY_ENABLED: "false"
        remoteEnv:
          PAYMENT_SVC_NAME: payment-svc
          PAYMENT_SVC_DISCOVERY_ENABLED: "true"

  order-svc:
    path: services/order-svc
    policy: go-service
    kinds: [http]
    discovery:
      analyzer: go-module
      certifier: go-generic
    runner:
      workdir: .
      prepare: [go, mod, download]
      build: [go, build, -o, "${artifact}", ./cmd/server]
      run: ["${artifact}"]
    ports:
      http: 18081
    healthChecks:
      - server: http
        type: tcp
        address: "127.0.0.1:${port.http}"
        timeout: 30s
    dependencies:
      payment-svc:
        localEnv:
          PAYMENT_SVC_ADDR: "127.0.0.1:${services.payment-svc.ports.rpc}"
          PAYMENT_SVC_DISCOVERY_ENABLED: "false"
        remoteEnv:
          PAYMENT_SVC_NAME: payment-svc
          PAYMENT_SVC_DISCOVERY_ENABLED: "true"

  payment-svc:
    path: services/payment-svc
    policy: go-service
    kinds: [rpc]
    discovery:
      analyzer: go-module
      certifier: go-generic
    runner:
      workdir: .
      prepare: [go, mod, download]
      build: [go, build, -o, "${artifact}", ./cmd/server]
      run: ["${artifact}"]
    ports:
      rpc: 18082
    healthChecks:
      - server: rpc
        type: tcp
        address: "127.0.0.1:${port.rpc}"
        timeout: 30s
