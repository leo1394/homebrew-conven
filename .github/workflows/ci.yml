name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Check project plugins are not bundled
        run: test ! -e internal/plugins/builtin/generate-apollo-consul.py
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./cmd/conven

  homebrew:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Formula
        run: |
          mandoc -Tlint docs/conven.1
          ruby -c Formula/conven.rb
          brew style Formula/conven.rb
      - name: Install and test stable and HEAD Formula from checkout
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: |
          set -euo pipefail
          tap="conven-ci/conven"
          brew tap-new --no-git "$tap"
          tap_dir="$(brew --repository "$tap")"
          formula="$tap_dir/Formula/conven.rb"
          cp Formula/conven.rb "$formula"
          ruby -pi -e 'url = "file://" + ENV.fetch("GITHUB_WORKSPACE"); $_ = $_.sub(/^  head .*$/, "  head #{url.inspect}, using: :git")' "$formula"
          grep -F "head \"file://$GITHUB_WORKSPACE\", using: :git" "$formula"
          brew install "$tap/conven"
          brew test "$tap/conven"
          brew uninstall "$tap/conven"
          brew install --HEAD "$tap/conven"
          brew test "$tap/conven"

          conven_prefix="$(brew --prefix "$tap/conven")"
          conven_bin="$conven_prefix/bin/conven"
          test -s "$conven_prefix/share/man/man1/conven.1"
          MANPATH="$conven_prefix/share/man" man -w conven | grep -Fq "$conven_prefix/share/man/man1/conven.1"
          completion_dir="$RUNNER_TEMP/conven-completions"
          mkdir -p "$completion_dir"
          "$conven_bin" __completion bash > "$completion_dir/conven.bash"
          "$conven_bin" __completion zsh > "$completion_dir/_conven"
          "$conven_bin" __completion fish > "$completion_dir/conven.fish"
          grep -Fq "complete -F _conven conven" "$completion_dir/conven.bash"
          grep -Fq "#compdef conven" "$completion_dir/_conven"
          grep -Fq "complete -c conven" "$completion_dir/conven.fish"
          bash_top="$(grep -m 1 -F 'compgen -W "' "$completion_dir/conven.bash" | sed -E 's/.*compgen -W "([^"]+)".*/\1/')"
          for command in init services config policy plugins doctor help version; do
            case " $bash_top " in
              *" $command "*) ;;
              *) echo "missing bash top-level completion: $command" >&2; exit 1 ;;
            esac
            grep -Fq "        '$command:" "$completion_dir/_conven"
            grep -Fq "complete -c conven -f -n '__fish_use_subcommand' -a $command " "$completion_dir/conven.fish"
          done
          for command in discover list status logs start restart stop; do
            case " $bash_top " in
              *" $command "*) echo "retained bash top-level completion: $command" >&2; exit 1 ;;
            esac
            ! grep -Fq "        '$command:" "$completion_dir/_conven"
            ! grep -Fq "complete -c conven -f -n '__fish_use_subcommand' -a $command " "$completion_dir/conven.fish"
          done
          for action in list registry status logs start restart stop stop-all; do
            grep -Fq -- "--$action" "$completion_dir/conven.bash"
            grep -Fq -- "--$action" "$completion_dir/_conven"
            grep -Fq -- "-l $action" "$completion_dir/conven.fish"
          done
          for action in edit import reset; do
            grep -Fq -- "--$action" "$completion_dir/conven.bash"
            grep -Fq -- "--$action" "$completion_dir/_conven"
            grep -Fq -- "-l $action" "$completion_dir/conven.fish"
          done
          for action in install list remove run; do
            grep -Fq -- "--$action" "$completion_dir/conven.bash"
            grep -Fq -- "--$action" "$completion_dir/_conven"
            grep -Fq -- "-l $action" "$completion_dir/conven.fish"
          done
          for shortcut in --dev --test; do
            grep -Fq -- "$shortcut" "$completion_dir/conven.bash"
            grep -Fq -- "$shortcut" "$completion_dir/_conven"
          done
          grep -Fq -- "-l dev" "$completion_dir/conven.fish"
          grep -Fq -- "-l test" "$completion_dir/conven.fish"
          grep -Fq -- "--tail" "$completion_dir/conven.bash"
          grep -Fq -- "--tail" "$completion_dir/_conven"
          grep -Fq -- "-l tail" "$completion_dir/conven.fish"
          grep -Fq -- "--prune" "$completion_dir/conven.bash"
          grep -Fq -- "--prune" "$completion_dir/_conven"
          grep -Fq -- "-l prune" "$completion_dir/conven.fish"
          ! grep -Fq -- "--follow" "$completion_dir/conven.bash" "$completion_dir/_conven"
          ! grep -Fq -- "-l follow" "$completion_dir/conven.fish"
          ! grep -Fq -- "--workspace" "$completion_dir/conven.bash" "$completion_dir/_conven"
          ! grep -Fq -- "--config" "$completion_dir/conven.bash" "$completion_dir/_conven"
          ! grep -Fq -- "-l workspace" "$completion_dir/conven.fish"
          ! grep -Fq -- "-l config" "$completion_dir/conven.fish"
          ! grep -Fq "convening" "$completion_dir/conven.bash" "$completion_dir/_conven" "$completion_dir/conven.fish"
