name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Check installer syntax
        run: bash -n install.sh
      - name: Check module graph
        run: go mod tidy -diff
      - name: Test
        run: go test ./...
      - name: Test race detector
        if: runner.os == 'Linux'
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./cmd/conven

  homebrew:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Formula
        run: |
          # Check manpage correctness; source-line length is editorial style.
          mandoc -Tlint -Wwarning docs/conven.1
          ruby -c Formula/conven.rb
          brew style Formula/conven.rb install.sh
      - name: Install and test HEAD Formula from checkout
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: |
          set -euo pipefail
          tap="conven-ci/conven"
          brew tap-new --no-git "$tap"
          tap_dir="$(brew --repository "$tap")"
          formula="$tap_dir/Formula/conven.rb"
          cp Formula/conven.rb "$formula"
          git update-ref refs/heads/conven-ci-head "$GITHUB_SHA"
          test "$(git rev-parse refs/heads/conven-ci-head)" = "$GITHUB_SHA"
          # shellcheck disable=SC2016
          ruby -pi -e 'url = "file://" + ENV.fetch("GITHUB_WORKSPACE"); $_ = $_.sub(/^  head .*$/, "  head #{url.inspect}, using: :git, branch: \"conven-ci-head\"")' "$formula"
          grep -F "head \"file://$GITHUB_WORKSPACE\", using: :git, branch: \"conven-ci-head\"" "$formula"
          brew install --HEAD "$tap/conven"
          brew test "$tap/conven"
