name: brew pr-pull
run-name: "brew pr-pull #${{ inputs.pull_request }} @ ${{ inputs.head_sha }} [cycle ${{ inputs.publication_cycle }}; attempt ${{ inputs.publish_attempt }}/2; retry-of ${{ inputs.retry_of_run }}]"

on:
  workflow_dispatch:
    inputs:
      pull_request:
        description: Pull request number
        required: true
      head_sha:
        description: Expected pull request head commit SHA
        required: true
      publication_cycle:
        description: Monotonic publication cycle number
        required: true
      publish_attempt:
        description: Publication attempt number (1 or 2)
        required: true
      retry_of_run:
        description: Failed attempt 1 run ID, or none for attempt 1
        required: true
      retry_fingerprint:
        description: Verified transient failure fingerprint, or none for attempt 1
        required: true
      expected_base_sha:
        description: Expected pull request base commit SHA
        required: true
      expected_master_sha:
        description: Expected origin/master commit SHA
        required: true
      release_name:
        description: Expected GitHub Release name
        required: true
      source_tag:
        description: Expected annotated source tag name
        required: true
      expected_source_sha:
        description: Expected peeled source commit SHA
        required: true
      expected_source_tag_object:
        description: Expected annotated source tag object SHA
        required: true
      recovery_base_sha:
        description: Merged pull request base SHA for interrupted publication recovery
        required: false
      recovery_merge_sha:
        description: Merged pull request merge SHA for interrupted publication recovery
        required: false
      recovery_master_sha:
        description: Expected master SHA for interrupted publication recovery
        required: false

concurrency:
  group: "brew-pr-pull-${{ github.repository }}"
  cancel-in-progress: false

permissions: {}

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  pr-pull:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      checks: read
      contents: write
      issues: read
      pull-requests: write
    steps:
      - name: Validate publication attempt
        id: publication_guard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_BASE_SHA: ${{ inputs.expected_base_sha }}
          EXPECTED_MASTER_SHA: ${{ inputs.expected_master_sha }}
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
          EXPECTED_SOURCE_TAG_OBJECT: ${{ inputs.expected_source_tag_object }}
          HEAD_SHA: ${{ inputs.head_sha }}
          PUBLICATION_CYCLE: ${{ inputs.publication_cycle }}
          PUBLISH_ATTEMPT: ${{ inputs.publish_attempt }}
          PULL_REQUEST: ${{ inputs.pull_request }}
          RECOVERY_BASE_SHA: ${{ inputs.recovery_base_sha }}
          RECOVERY_MERGE_SHA: ${{ inputs.recovery_merge_sha }}
          RECOVERY_MASTER_SHA: ${{ inputs.recovery_master_sha }}
          RELEASE_NAME: ${{ inputs.release_name }}
          RETRY_FINGERPRINT: ${{ inputs.retry_fingerprint }}
          RETRY_OF_RUN: ${{ inputs.retry_of_run }}
          SOURCE_TAG: ${{ inputs.source_tag }}
        run: |
          [[ "$PULL_REQUEST" =~ ^[1-9][0-9]*$ ]]
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$PUBLICATION_CYCLE" =~ ^[1-9][0-9]{0,5}$ ]]
          [[ "$PUBLISH_ATTEMPT" =~ ^[12]$ ]]
          [[ "$EXPECTED_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_MASTER_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_SOURCE_TAG_OBJECT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RELEASE_NAME" =~ ^conven-[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$SOURCE_TAG" == "v${RELEASE_NAME#conven-}" ]]
          [[ "$GITHUB_RUN_ATTEMPT" == "1" ]]

          list_canonical_run_ids() {
            local expected_name="$1"
            local attempts=0
            local ids=""
            while [[ "$attempts" -lt 5 ]]; do
              ids=$(gh api --method GET --paginate \
                "repos/$GITHUB_REPOSITORY/actions/workflows/publish.yml/runs" \
                -f event=workflow_dispatch -f per_page=100 \
                --jq ".workflow_runs[] | select(.display_title == \"$expected_name\" and .head_branch == \"master\" and .head_sha == \"$EXPECTED_MASTER_SHA\" and .conclusion != \"cancelled\") | .id")
              if grep -Fxq "$GITHUB_RUN_ID" <<< "$ids" ||
                [[ -z "${expected_run_name:-}" || "$expected_name" != "$expected_run_name" ]]; then
                printf '%s\n' "$ids"
                return 0
              fi
              attempts=$((attempts + 1))
              sleep 2
            done
            return 1
          }

          recovery=false
          if [[ -n "$RECOVERY_BASE_SHA" || -n "$RECOVERY_MERGE_SHA" || -n "$RECOVERY_MASTER_SHA" ]]; then
            recovery=true
            [[ "$RECOVERY_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
            [[ "$RECOVERY_MERGE_SHA" =~ ^[0-9a-f]{40}$ ]]
            [[ "$RECOVERY_MASTER_SHA" =~ ^[0-9a-f]{40}$ ]]
            [[ "$EXPECTED_BASE_SHA" == "$RECOVERY_BASE_SHA" ]]
            [[ "$EXPECTED_MASTER_SHA" == "$RECOVERY_MASTER_SHA" ]]
            [[ "$PUBLISH_ATTEMPT" == "1" ]]
            [[ "$RETRY_OF_RUN" == "none" ]]
            [[ "$RETRY_FINGERPRINT" == "none" ]]
          elif [[ "$PUBLISH_ATTEMPT" == "1" ]]; then
            [[ "$RETRY_OF_RUN" == "none" ]]
            [[ "$RETRY_FINGERPRINT" == "none" ]]
          else
            [[ "$RETRY_OF_RUN" =~ ^[1-9][0-9]*$ ]]
            [[ "$RETRY_FINGERPRINT" =~ ^[0-9a-f]{64}$ ]]
            [[ "$RETRY_OF_RUN" -lt "$GITHUB_RUN_ID" ]]
            expected_retry_name="brew pr-pull #$PULL_REQUEST @ $HEAD_SHA [cycle $PUBLICATION_CYCLE; attempt 1/2; retry-of none]"
            retry_run=$(gh api --method GET \
              "repos/$GITHUB_REPOSITORY/actions/runs/$RETRY_OF_RUN" \
              --jq '[.event, .status, (.conclusion // ""), .display_title, .head_branch, .head_sha] | @tsv')
            IFS=$'\t' read -r retry_event retry_status retry_conclusion retry_name \
              retry_branch retry_sha <<< "$retry_run"
            [[ "$retry_event" == "workflow_dispatch" ]]
            [[ "$retry_status" == "completed" && "$retry_conclusion" == "failure" ]]
            [[ "$retry_name" == "$expected_retry_name" ]]
            [[ "$retry_branch" == "master" ]]
            [[ "$retry_sha" == "$EXPECTED_MASTER_SHA" ]]
            retry_steps="$RUNNER_TEMP/conven-retry-steps-$GITHUB_RUN_ID"
            retry_log="$RUNNER_TEMP/conven-retry-log-$GITHUB_RUN_ID"
            umask 077
            # shellcheck disable=SC2016
            gh run view "$RETRY_OF_RUN" --repo "$GITHUB_REPOSITORY" \
              --json jobs --jq '
                .jobs[]
                | select(.conclusion != null and .conclusion != "success" and .conclusion != "skipped")
                | .name as $job
                | .conclusion as $conclusion
                | ([.steps[]? | select(.conclusion != null and .conclusion != "success" and .conclusion != "skipped") | .name]) as $steps
                | if ($steps | length) > 0 then
                    $steps[] | [$job, .] | @tsv
                  else
                    [$job, ("job concluded " + $conclusion)] | @tsv
                  end
              ' > "$retry_steps"
            [[ "$(wc -l < "$retry_steps" | tr -d '[:space:]')" == "1" ]]
            grep -Fqx $'pr-pull\tPull bottles' "$retry_steps"
            gh run view "$RETRY_OF_RUN" --repo "$GITHUB_REPOSITORY" --log-failed \
              > "$retry_log"
            grep -Fq 'Creating new GitHub release' "$retry_log"
            grep -Fq 'Failed to parse JSON response' "$retry_log"
            grep -Fq "unexpected token at end of stream '{' at line 3 column 1" "$retry_log"
            grep -Fq 'GitHub::API.open_rest' "$retry_log"
            grep -Fq 'GitHub.create_or_update_release' "$retry_log"
            grep -Fq 'GitHubReleases#upload_bottles' "$retry_log"
            grep -Eq 'brew pr-upload --debug --keep-old.*(exited with|exit(ed)? status)[[:space:]]+1' "$retry_log"
            if grep -Eq 'Upload(ing|ed).*\.bottle\.tar\.gz|\.bottle\.tar\.gz.*upload(ed|ing)' "$retry_log"; then
              exit 1
            fi
            fingerprint_file="$RUNNER_TEMP/conven-retry-fingerprint-$GITHUB_RUN_ID"
            printf '%s\n' \
              'pr-pull / Pull bottles' \
              'Creating new GitHub release' \
              'Failed to parse JSON response' \
              "unexpected token at end of stream '{' at line 3 column 1" \
              'GitHub::API.open_rest' \
              'GitHub.create_or_update_release' \
              'GitHubReleases#upload_bottles' \
              'brew pr-upload --debug --keep-old exited with 1' \
              > "$fingerprint_file"
            expected_retry_fingerprint=$(sha256sum "$fingerprint_file" | awk '{print $1}')
            [[ "$RETRY_FINGERPRINT" == "$expected_retry_fingerprint" ]]
            retry_ids=$(list_canonical_run_ids "$expected_retry_name")
            canonical_retry_id=$(LC_ALL=C awk '
              /^[0-9]+$/ && (minimum == "" || $1 + 0 < minimum + 0) { minimum = $1 }
              END { if (minimum != "") print minimum }
            ' <<< "$retry_ids")
            [[ "$RETRY_OF_RUN" == "$canonical_retry_id" ]]
          fi

          expected_run_name="brew pr-pull #$PULL_REQUEST @ $HEAD_SHA [cycle $PUBLICATION_CYCLE; attempt $PUBLISH_ATTEMPT/2; retry-of $RETRY_OF_RUN]"
          run_ids=$(list_canonical_run_ids "$expected_run_name")
          canonical_run_id=$(LC_ALL=C awk '
            /^[0-9]+$/ && (minimum == "" || $1 + 0 < minimum + 0) { minimum = $1 }
            END { if (minimum != "") print minimum }
          ' <<< "$run_ids")
          [[ -n "$canonical_run_id" ]]
          if [[ "$GITHUB_RUN_ID" != "$canonical_run_id" ]]; then
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "Duplicate publication dispatch; canonical run is $canonical_run_id."
            exit 0
          fi

          if [[ "$recovery" == "true" ]]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            [[ "$EXPECTED_BASE_SHA" == "$EXPECTED_MASTER_SHA" ]]
            [[ "$GITHUB_SHA" == "$EXPECTED_MASTER_SHA" ]]
            pull_request_state=$(gh api --method GET \
              "repos/$GITHUB_REPOSITORY/pulls/$PULL_REQUEST" \
              --jq '[.state, .merged, .head.sha, .head.ref, .base.sha, .base.ref] | @tsv')
            IFS=$'\t' read -r state merged head head_branch base base_branch <<< "$pull_request_state"
            [[ "$state" == "open" && "$merged" == "false" ]]
            [[ "$head" == "$HEAD_SHA" ]]
            [[ "$head_branch" == "bottle/$RELEASE_NAME" ]]
            [[ "$base" == "$EXPECTED_BASE_SHA" ]]
            [[ "$base_branch" == "master" ]]
            master_sha=$(gh api --method GET \
              "repos/$GITHUB_REPOSITORY/git/ref/heads/master" --jq '.object.sha')
            [[ "$master_sha" == "$EXPECTED_MASTER_SHA" ]]
          fi

          release_json="$RUNNER_TEMP/conven-release-$GITHUB_RUN_ID.json"
          release_error="$RUNNER_TEMP/conven-release-$GITHUB_RUN_ID.err"
          umask 077
          release_exists=false
          if gh api --method GET \
            "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_NAME" \
            > "$release_json" 2> "$release_error"; then
            release_exists=true
            asset_count=$(jq '.assets | length' "$release_json")
            if [[ "$asset_count" -gt 0 ]]; then
              echo "Error: automatic bottle retry refused: Release $RELEASE_NAME contains $asset_count asset(s)." >&2
              jq -r '.assets[].name | "  - \(.)"' "$release_json" >&2
              echo "  - Release: $(jq -r '.html_url' "$release_json")" >&2
              echo "  => Do not merge the Bottle PR or retry automatically; inspect and reconcile the Release and Formula state, then rerun --apply --bottle." >&2
              exit 1
            fi
            [[ "$(jq -r '.tag_name' "$release_json")" == "$RELEASE_NAME" ]]
            [[ "$(jq -r '.name' "$release_json")" == "$RELEASE_NAME" ]]
            [[ "$(jq -r '.target_commitish' "$release_json")" == "master" ]]
            [[ "$(jq -r '.draft' "$release_json")" == "false" ]]
            [[ "$(jq -r '.prerelease' "$release_json")" == "false" ]]
          elif ! grep -Fq '(HTTP 404)' "$release_error"; then
            echo "Error: unable to verify GitHub Release $RELEASE_NAME." >&2
            exit 1
          fi

          release_ref_json="$RUNNER_TEMP/conven-release-ref-$GITHUB_RUN_ID.json"
          release_ref_error="$RUNNER_TEMP/conven-release-ref-$GITHUB_RUN_ID.err"
          if gh api --method GET \
            "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_NAME" \
            > "$release_ref_json" 2> "$release_ref_error"; then
            [[ "$release_exists" == "true" ]]
            [[ "$(jq -r '.object.type' "$release_ref_json")" == "commit" ]]
            [[ "$(jq -r '.object.sha' "$release_ref_json")" == "$EXPECTED_MASTER_SHA" ]]
          elif grep -Fq '(HTTP 404)' "$release_ref_error"; then
            [[ "$release_exists" == "false" ]]
          else
            echo "Error: unable to verify GitHub Release tag $RELEASE_NAME." >&2
            exit 1
          fi

          source_tag_data=$(gh api --method GET \
            "repos/$GITHUB_REPOSITORY/git/ref/tags/$SOURCE_TAG" \
            --jq '[.object.type, .object.sha] | @tsv')
          IFS=$'\t' read -r source_tag_type source_tag_object <<< "$source_tag_data"
          [[ "$source_tag_type" == "tag" ]]
          [[ "$source_tag_object" == "$EXPECTED_SOURCE_TAG_OBJECT" ]]
          source_tag_target=$(gh api --method GET \
            "repos/$GITHUB_REPOSITORY/git/tags/$source_tag_object" \
            --jq '[.object.type, .object.sha] | @tsv')
          IFS=$'\t' read -r source_target_type source_target_sha <<< "$source_tag_target"
          [[ "$source_target_type" == "commit" ]]
          [[ "$source_target_sha" == "$EXPECTED_SOURCE_SHA" ]]
          echo "proceed=true" >> "$GITHUB_OUTPUT"

      - name: Set up Homebrew
        if: steps.publication_guard.outputs.proceed == 'true'
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@a657b8b0cd35d0f65cce41fce9b24cf054b49869 # 2026.08.24.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Pin Homebrew
        if: steps.publication_guard.outputs.proceed == 'true'
        id: homebrew-pin
        run: |
          tap_path=$(brew --repo "$GITHUB_REPOSITORY")
          pin_file="$tap_path/.github/homebrew-brew.commit"
          [[ -f "$pin_file" ]]
          brew_commit=$(tr -d '[:space:]' < "$pin_file")
          [[ "$brew_commit" =~ ^[0-9a-f]{40}$ ]]
          brew_repository=$(brew --repo)
          if [[ "$(git -C "$brew_repository" rev-parse --is-shallow-repository)" == "true" ]]; then
            git -C "$brew_repository" fetch --quiet --unshallow --tags origin
          else
            git -C "$brew_repository" fetch --quiet --tags origin
          fi
          git -C "$brew_repository" fetch --quiet origin "$brew_commit"
          git -C "$brew_repository" checkout --quiet --force -B main "$brew_commit"
          git -C "$brew_repository" update-ref refs/remotes/origin/main "$brew_commit"
          [[ "$(git -C "$brew_repository" rev-parse HEAD)" == "$brew_commit" ]]
          [[ "$(git -C "$brew_repository" rev-parse refs/remotes/origin/main)" == "$brew_commit" ]]
          git -C "$brew_repository" describe --tags --abbrev=0 "$brew_commit" >/dev/null
          echo "commit=$brew_commit" >> "$GITHUB_OUTPUT"
          echo 'HOMEBREW_NO_AUTO_UPDATE=1' >> "$GITHUB_ENV"

      - name: Set up git
        if: steps.publication_guard.outputs.proceed == 'true'
        id: git_setup
        uses: Homebrew/actions/git-user-config@a657b8b0cd35d0f65cce41fce9b24cf054b49869 # 2026.08.24.1

      - name: Recheck publication state
        if: steps.publication_guard.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_BASE_SHA: ${{ inputs.expected_base_sha }}
          EXPECTED_MASTER_SHA: ${{ inputs.expected_master_sha }}
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
          EXPECTED_SOURCE_TAG_OBJECT: ${{ inputs.expected_source_tag_object }}
          HEAD_SHA: ${{ inputs.head_sha }}
          PULL_REQUEST: ${{ inputs.pull_request }}
          RECOVERY_BASE_SHA: ${{ inputs.recovery_base_sha }}
          RECOVERY_MERGE_SHA: ${{ inputs.recovery_merge_sha }}
          RECOVERY_MASTER_SHA: ${{ inputs.recovery_master_sha }}
          RELEASE_NAME: ${{ inputs.release_name }}
          SOURCE_TAG: ${{ inputs.source_tag }}
        run: |
          if [[ -z "$RECOVERY_BASE_SHA" && -z "$RECOVERY_MERGE_SHA" && -z "$RECOVERY_MASTER_SHA" ]]; then
            [[ "$EXPECTED_BASE_SHA" == "$EXPECTED_MASTER_SHA" ]]
            [[ "$GITHUB_SHA" == "$EXPECTED_MASTER_SHA" ]]
            pull_request_state=$(gh api --method GET \
              "repos/$GITHUB_REPOSITORY/pulls/$PULL_REQUEST" \
              --jq '[.state, .merged, .head.sha, .head.ref, .base.sha, .base.ref] | @tsv')
            IFS=$'\t' read -r state merged head head_branch base base_branch <<< "$pull_request_state"
            [[ "$state" == "open" && "$merged" == "false" ]]
            [[ "$head" == "$HEAD_SHA" ]]
            [[ "$head_branch" == "bottle/$RELEASE_NAME" ]]
            [[ "$base" == "$EXPECTED_BASE_SHA" ]]
            [[ "$base_branch" == "master" ]]
            master_sha=$(gh api --method GET \
              "repos/$GITHUB_REPOSITORY/git/ref/heads/master" --jq '.object.sha')
            [[ "$master_sha" == "$EXPECTED_MASTER_SHA" ]]
          fi

          tap_path=$(brew --repo "$GITHUB_REPOSITORY")
          git -C "$tap_path" fetch --quiet origin "$HEAD_SHA"
          git -C "$tap_path" cat-file -e "$HEAD_SHA^{commit}"
          formula_contents=$(git -C "$tap_path" show "$HEAD_SHA:Formula/conven.rb")
          grep -Fqx \
            "  url \"https://github.com/$GITHUB_REPOSITORY/archive/refs/tags/$SOURCE_TAG.tar.gz\"" \
            <<< "$formula_contents"
          formula_release_name=$(sed -nE \
            's|^[[:space:]]+root_url ".*/releases/download/([^\"]+)"$|\1|p' \
            <<< "$formula_contents")
          if [[ -n "$formula_release_name" ]]; then
            [[ "$formula_release_name" == "$RELEASE_NAME" ]]
          fi

          release_json="$RUNNER_TEMP/conven-release-recheck-$GITHUB_RUN_ID.json"
          release_error="$RUNNER_TEMP/conven-release-recheck-$GITHUB_RUN_ID.err"
          umask 077
          release_exists=false
          if gh api --method GET \
            "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_NAME" \
            > "$release_json" 2> "$release_error"; then
            release_exists=true
            asset_count=$(jq '.assets | length' "$release_json")
            if [[ "$asset_count" -gt 0 ]]; then
              echo "Error: automatic bottle retry refused: Release $RELEASE_NAME contains $asset_count asset(s)." >&2
              jq -r '.assets[].name | "  - \(.)"' "$release_json" >&2
              echo "  - Release: $(jq -r '.html_url' "$release_json")" >&2
              echo "  => Do not merge the Bottle PR or retry automatically; inspect and reconcile the Release and Formula state, then rerun --apply --bottle." >&2
              exit 1
            fi
            [[ "$(jq -r '.tag_name' "$release_json")" == "$RELEASE_NAME" ]]
            [[ "$(jq -r '.name' "$release_json")" == "$RELEASE_NAME" ]]
            [[ "$(jq -r '.target_commitish' "$release_json")" == "master" ]]
            [[ "$(jq -r '.draft' "$release_json")" == "false" ]]
            [[ "$(jq -r '.prerelease' "$release_json")" == "false" ]]
          elif ! grep -Fq '(HTTP 404)' "$release_error"; then
            echo "Error: unable to verify GitHub Release $RELEASE_NAME." >&2
            exit 1
          fi

          release_ref_json="$RUNNER_TEMP/conven-release-ref-recheck-$GITHUB_RUN_ID.json"
          release_ref_error="$RUNNER_TEMP/conven-release-ref-recheck-$GITHUB_RUN_ID.err"
          if gh api --method GET \
            "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_NAME" \
            > "$release_ref_json" 2> "$release_ref_error"; then
            [[ "$release_exists" == "true" ]]
            [[ "$(jq -r '.object.type' "$release_ref_json")" == "commit" ]]
            [[ "$(jq -r '.object.sha' "$release_ref_json")" == "$EXPECTED_MASTER_SHA" ]]
          elif grep -Fq '(HTTP 404)' "$release_ref_error"; then
            [[ "$release_exists" == "false" ]]
          else
            echo "Error: unable to verify GitHub Release tag $RELEASE_NAME." >&2
            exit 1
          fi

          current_source_tag=$(gh api --method GET \
            "repos/$GITHUB_REPOSITORY/git/ref/tags/$SOURCE_TAG" \
            --jq '[.object.type, .object.sha] | @tsv')
          IFS=$'\t' read -r source_tag_type source_tag_object <<< "$current_source_tag"
          [[ "$source_tag_type" == "tag" ]]
          [[ "$source_tag_object" == "$EXPECTED_SOURCE_TAG_OBJECT" ]]
          current_source_target=$(gh api --method GET \
            "repos/$GITHUB_REPOSITORY/git/tags/$source_tag_object" \
            --jq '[.object.type, .object.sha] | @tsv')
          IFS=$'\t' read -r source_target_type source_target_sha <<< "$current_source_target"
          [[ "$source_target_type" == "commit" ]]
          [[ "$source_target_sha" == "$EXPECTED_SOURCE_SHA" ]]

      - name: Pull bottles
        if: steps.publication_guard.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_GIT_COMMITTER_NAME: ${{ steps.git_setup.outputs.name }}
          HOMEBREW_GIT_COMMITTER_EMAIL: ${{ steps.git_setup.outputs.email }}
          EXPECTED_HOMEBREW_SHA: ${{ steps.homebrew-pin.outputs.commit }}
          EXPECTED_MASTER_SHA: ${{ inputs.expected_master_sha }}
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
          EXPECTED_SOURCE_TAG_OBJECT: ${{ inputs.expected_source_tag_object }}
          HEAD_SHA: ${{ inputs.head_sha }}
          PULL_REQUEST: ${{ inputs.pull_request }}
          RECOVERY_BASE_SHA: ${{ inputs.recovery_base_sha }}
          RECOVERY_MERGE_SHA: ${{ inputs.recovery_merge_sha }}
          RECOVERY_MASTER_SHA: ${{ inputs.recovery_master_sha }}
          RELEASE_NAME: ${{ inputs.release_name }}
          SOURCE_TAG: ${{ inputs.source_tag }}
        run: |
          verify_source_tag() {
            local source_tag_data source_tag_type source_tag_object
            local source_tag_target source_target_type source_target_sha
            source_tag_data=$(gh api --method GET \
              "repos/$GITHUB_REPOSITORY/git/ref/tags/$SOURCE_TAG" \
              --jq '[.object.type, .object.sha] | @tsv')
            IFS=$'\t' read -r source_tag_type source_tag_object <<< "$source_tag_data"
            [[ "$source_tag_type" == "tag" ]]
            [[ "$source_tag_object" == "$EXPECTED_SOURCE_TAG_OBJECT" ]]
            source_tag_target=$(gh api --method GET \
              "repos/$GITHUB_REPOSITORY/git/tags/$source_tag_object" \
              --jq '[.object.type, .object.sha] | @tsv')
            IFS=$'\t' read -r source_target_type source_target_sha <<< "$source_tag_target"
            [[ "$source_target_type" == "commit" ]]
            [[ "$source_target_sha" == "$EXPECTED_SOURCE_SHA" ]]
          }

          verify_normal_publication_state() {
            local asset_count base base_branch head head_branch master_sha merged
            local release_error release_exists release_json release_ref_error release_ref_json state
            pull_request_state=$(gh api --method GET \
              "repos/$GITHUB_REPOSITORY/pulls/$PULL_REQUEST" \
              --jq '[.state, .merged, .head.sha, .head.ref, .base.sha, .base.ref] | @tsv')
            IFS=$'\t' read -r state merged head head_branch base base_branch <<< "$pull_request_state"
            [[ "$state" == "open" && "$merged" == "false" ]]
            [[ "$head" == "$HEAD_SHA" && "$head_branch" == "bottle/$RELEASE_NAME" ]]
            [[ "$base" == "$EXPECTED_MASTER_SHA" && "$base_branch" == "master" ]]
            master_sha=$(gh api --method GET \
              "repos/$GITHUB_REPOSITORY/git/ref/heads/master" --jq '.object.sha')
            [[ "$master_sha" == "$EXPECTED_MASTER_SHA" ]]

            release_json="$RUNNER_TEMP/conven-release-final-$GITHUB_RUN_ID.json"
            release_error="$RUNNER_TEMP/conven-release-final-$GITHUB_RUN_ID.err"
            release_ref_json="$RUNNER_TEMP/conven-release-ref-final-$GITHUB_RUN_ID.json"
            release_ref_error="$RUNNER_TEMP/conven-release-ref-final-$GITHUB_RUN_ID.err"
            umask 077
            release_exists=false
            if gh api --method GET \
              "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_NAME" \
              > "$release_json" 2> "$release_error"; then
              release_exists=true
              asset_count=$(jq '.assets | length' "$release_json")
              [[ "$asset_count" =~ ^[0-9]+$ ]]
              if [[ "$asset_count" -gt 0 ]]; then
                echo "Error: automatic bottle retry refused: Release $RELEASE_NAME contains $asset_count asset(s)." >&2
                jq -r '.assets[].name | "  - \(.)"' "$release_json" >&2
                echo "  - Release: $(jq -r '.html_url' "$release_json")" >&2
                echo "  => Do not merge the Bottle PR or retry automatically; inspect and reconcile the Release and Formula state, then rerun --apply --bottle." >&2
                exit 1
              fi
              [[ "$(jq -r '.tag_name' "$release_json")" == "$RELEASE_NAME" ]]
              [[ "$(jq -r '.name' "$release_json")" == "$RELEASE_NAME" ]]
              [[ "$(jq -r '.target_commitish' "$release_json")" == "master" ]]
              [[ "$(jq -r '.draft' "$release_json")" == "false" ]]
              [[ "$(jq -r '.prerelease' "$release_json")" == "false" ]]
            elif ! grep -Fq '(HTTP 404)' "$release_error"; then
              echo "Error: unable to verify GitHub Release $RELEASE_NAME immediately before bottle publication." >&2
              exit 1
            fi
            if gh api --method GET \
              "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_NAME" \
              > "$release_ref_json" 2> "$release_ref_error"; then
              [[ "$release_exists" == "true" ]]
              [[ "$(jq -r '.object.type' "$release_ref_json")" == "commit" ]]
              [[ "$(jq -r '.object.sha' "$release_ref_json")" == "$EXPECTED_MASTER_SHA" ]]
            elif grep -Fq '(HTTP 404)' "$release_ref_error"; then
              [[ "$release_exists" == "false" ]]
            else
              echo "Error: unable to verify GitHub Release tag $RELEASE_NAME immediately before bottle publication." >&2
              exit 1
            fi
          }

          if [[ -n "$RECOVERY_BASE_SHA" || -n "$RECOVERY_MERGE_SHA" || -n "$RECOVERY_MASTER_SHA" ]]; then
            [[ "$RECOVERY_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
            [[ "$RECOVERY_MERGE_SHA" =~ ^[0-9a-f]{40}$ ]]
            [[ "$RECOVERY_MASTER_SHA" =~ ^[0-9a-f]{40}$ ]]
            [[ "$GITHUB_SHA" == "$RECOVERY_MASTER_SHA" ]]
            pull_request_state=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PULL_REQUEST" \
              --jq '[.state, .merged, .head.sha, .head.ref, .base.sha, .base.ref, .merge_commit_sha] | @tsv')
            IFS=$'\t' read -r state merged head head_branch base base_branch merge <<< "$pull_request_state"
            [[ "$state" == "closed" && "$merged" == "true" ]]
            [[ "$head" == "$HEAD_SHA" ]]
            [[ "$base" == "$RECOVERY_BASE_SHA" ]]
            [[ "$base_branch" == "master" ]]
            [[ "$merge" == "$RECOVERY_MERGE_SHA" ]]
            tap_path=$(brew --repo "$GITHUB_REPOSITORY")
            git -C "$tap_path" fetch --quiet origin master
            [[ "$(git -C "$tap_path" symbolic-ref --short HEAD)" == "master" ]]
            [[ "$(git -C "$tap_path" rev-parse HEAD)" == "$RECOVERY_MASTER_SHA" ]]
            [[ "$(git -C "$tap_path" rev-parse origin/master)" == "$RECOVERY_MASTER_SHA" ]]
            merge_parents=$(git -C "$tap_path" rev-list --parents -n 1 "$RECOVERY_MERGE_SHA")
            [[ "$merge_parents" == "$RECOVERY_MERGE_SHA $RECOVERY_BASE_SHA $HEAD_SHA" ]]
            git -C "$tap_path" merge-base --is-ancestor "$RECOVERY_MERGE_SHA" "$RECOVERY_MASTER_SHA"
            [[ "$(git -C "$tap_path" rev-parse "$RECOVERY_MERGE_SHA^{tree}")" == \
              "$(git -C "$tap_path" rev-parse "$HEAD_SHA^{tree}")" ]]
            [[ "$(git -C "$tap_path" diff --name-only "$RECOVERY_BASE_SHA" "$HEAD_SHA")" == \
              "Formula/conven.rb" ]]
            [[ "$(git -C "$tap_path" diff --name-status "$RECOVERY_BASE_SHA" "$HEAD_SHA")" == \
              $'M\tFormula/conven.rb' ]]
            [[ "$(git -C "$tap_path" ls-tree "$HEAD_SHA" -- Formula/conven.rb | awk '{print $1 " " $2}')" == \
              "100644 blob" ]]
            [[ "$(git -C "$tap_path" rev-parse "$RECOVERY_MERGE_SHA:Formula/conven.rb")" == \
              "$(git -C "$tap_path" rev-parse "$RECOVERY_MASTER_SHA:Formula/conven.rb")" ]]
            bottle_count=$(git -C "$tap_path" show "$HEAD_SHA:Formula/conven.rb" | \
              grep -Ec '^  bottle do[[:space:]]*$' || true)
            bottle_sha_count=$(git -C "$tap_path" show "$HEAD_SHA:Formula/conven.rb" | awk '
              /^  bottle do[[:space:]]*$/ { bottle = 1; next }
              bottle && /^  end[[:space:]]*$/ { bottle = 0; next }
              bottle && /^[[:space:]]+sha256[[:space:]]/ { count++ }
              END { print count + 0 }
            ')
            [[ "$bottle_count" == "1" && "$bottle_sha_count" == "0" ]]
            release_name=$(git -C "$tap_path" show "$HEAD_SHA:Formula/conven.rb" | \
              sed -nE 's|^[[:space:]]+root_url ".*/releases/download/([^\"]+)"$|\1|p')
            [[ "$release_name" =~ ^conven-[0-9]+\.[0-9]+\.[0-9]+$ ]]
            [[ "$release_name" == "$RELEASE_NAME" ]]
            [[ "$head_branch" == "bottle/$release_name" ]]
            git -C "$tap_path" show "$HEAD_SHA:Formula/conven.rb" | grep -Fqx \
              "    root_url \"https://github.com/$GITHUB_REPOSITORY/releases/download/$release_name\""
            release_error="$RUNNER_TEMP/conven-release-check.err"
            umask 077
            if gh api --method GET "repos/$GITHUB_REPOSITORY/releases/tags/$release_name" \
              --silent 2>"$release_error"; then
              echo "release $release_name already exists; refusing recovery overwrite" >&2
              exit 1
            elif ! grep -Fq '(HTTP 404)' "$release_error"; then
              echo "unable to verify release $release_name for recovery" >&2
              exit 1
            fi
            release_ref_error="$RUNNER_TEMP/conven-release-ref-check.err"
            if gh api --method GET "repos/$GITHUB_REPOSITORY/git/ref/tags/$release_name" \
              --silent 2>"$release_ref_error"; then
              echo "release tag $release_name already exists; refusing recovery overwrite" >&2
              exit 1
            elif ! grep -Fq '(HTTP 404)' "$release_ref_error"; then
              echo "unable to verify release tag $release_name for recovery" >&2
              exit 1
            fi
            test_runs=$(gh api --method GET --paginate \
              "repos/$GITHUB_REPOSITORY/actions/workflows/tests.yml/runs" -f per_page=100 \
              --jq ".workflow_runs[] | select(.event == \"pull_request\" and .head_branch == \"$head_branch\" and .head_sha == \"$HEAD_SHA\") | [.created_at, .id, .status, (.conclusion // \"\")] | @tsv")
            test_run=$(LC_ALL=C awk -F '\t' '
              NF >= 3 && ($1 > latest || ($1 == latest && $2 + 0 > id + 0)) {
                latest = $1
                id = $2
                status = $3
                conclusion = $4
              }
              END { if (id != "") printf "%s\t%s\t%s\n", id, status, conclusion }
            ' <<< "$test_runs")
            IFS=$'\t' read -r test_run_id test_status test_conclusion <<< "$test_run"
            [[ -n "$test_run_id" && "$test_status" == "completed" && "$test_conclusion" == "success" ]]
            verify_source_tag
            [[ "$(git -C "$(brew --repo)" rev-parse HEAD)" == "$EXPECTED_HOMEBREW_SHA" ]]
            GITHUB_SHA="$RECOVERY_BASE_SHA" brew pr-pull --debug --keep-old --clean \
              --no-cherry-pick --tap="$GITHUB_REPOSITORY" --head-sha="$HEAD_SHA" "$PULL_REQUEST"
            exit 0
          fi
          verify_source_tag
          verify_normal_publication_state
          [[ "$(git -C "$(brew --repo)" rev-parse HEAD)" == "$EXPECTED_HOMEBREW_SHA" ]]
          brew pr-pull --debug --keep-old --tap="$GITHUB_REPOSITORY" --head-sha="$HEAD_SHA" "$PULL_REQUEST"

      - name: Push recovered bottle commit
        if: ${{ steps.publication_guard.outputs.proceed == 'true' && inputs.recovery_base_sha != '' }}
        env:
          RECOVERY_MASTER_SHA: ${{ inputs.recovery_master_sha }}
        run: |
          tap_path=$(brew --repo "$GITHUB_REPOSITORY")
          git -C "$tap_path" fetch --quiet origin master
          [[ "$(git -C "$tap_path" symbolic-ref --short HEAD)" == "master" ]]
          [[ "$(git -C "$tap_path" rev-parse origin/master)" == "$RECOVERY_MASTER_SHA" ]]
          git -C "$tap_path" merge-base --is-ancestor "$RECOVERY_MASTER_SHA" HEAD
          [[ "$(git -C "$tap_path" rev-list --count "$RECOVERY_MASTER_SHA..HEAD")" == "1" ]]
          [[ "$(git -C "$tap_path" diff --name-only "$RECOVERY_MASTER_SHA" HEAD)" == \
            "Formula/conven.rb" ]]
          [[ "$(git -C "$tap_path" diff --name-status "$RECOVERY_MASTER_SHA" HEAD)" == \
            $'M\tFormula/conven.rb' ]]
          [[ "$(git -C "$tap_path" ls-tree HEAD -- Formula/conven.rb | awk '{print $1 " " $2}')" == \
            "100644 blob" ]]
          bottle_sha_count=$(git -C "$tap_path" show HEAD:Formula/conven.rb | awk '
            /^  bottle do[[:space:]]*$/ { bottle = 1; next }
            bottle && /^  end[[:space:]]*$/ { bottle = 0; next }
            bottle && /^[[:space:]]+sha256[[:space:]]/ { count++ }
            END { print count + 0 }
          ')
          [[ "$bottle_sha_count" -gt 0 ]]
          git -C "$tap_path" push origin "HEAD:refs/heads/master"

      - name: Push commits
        if: ${{ steps.publication_guard.outputs.proceed == 'true' && inputs.recovery_base_sha == '' && inputs.recovery_merge_sha == '' && inputs.recovery_master_sha == '' }}
        uses: Homebrew/actions/git-try-push@a657b8b0cd35d0f65cce41fce9b24cf054b49869 # 2026.08.24.1
        with:
          branch: master
